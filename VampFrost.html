*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#04050a}
#game{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;font-family:'Segoe UI',system-ui,sans-serif;color:#dfe9f5;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto}
.dim{background:rgba(2,3,8,.74)}
.solid{background:radial-gradient(1200px 700px at 50% 30%,#0a1120 0%,#04050a 70%)}
.title{font-size:min(11vw,92px);font-weight:900;letter-spacing:5px;color:#8fd8ff;
 text-shadow:0 3px 0 #a11c2c,0 6px 22px #58c8ff55,0 0 46px #7fd0ff33}
.sub{color:#9db4d6;margin-top:-8px;margin-bottom:24px;letter-spacing:2px}
.btn{pointer-events:auto;min-width:300px;padding:13px 34px;font-size:21px;font-weight:700;letter-spacing:3px;
 color:#eaf6ff;background:linear-gradient(180deg,#16243d,#0b1526);border:2px solid #3d5f8f;border-radius:6px;
 cursor:pointer;transition:.12s;box-shadow:0 4px 14px #0009,inset 0 1px 0 #ffffff14;text-align:center}
.btn:hover{border-color:#c8375a;background:linear-gradient(180deg,#3d1420,#160a12);box-shadow:0 0 18px #c8375a66}
.btn:active{transform:translateY(1px) scale(.99)}
.panel{background:#0a0f1cf2;border:2px solid #33507c;border-radius:10px;padding:26px 36px;
 box-shadow:0 10px 40px #000c;display:flex;flex-direction:column;align-items:center;gap:12px}
h2{color:#8fd8ff;letter-spacing:5px;font-size:32px;margin-bottom:6px;font-weight:800}
.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(230px,300px));gap:16px}
@media (max-width:900px){.mapgrid{grid-template-columns:repeat(2,minmax(200px,1fr))}}
.mapcard{pointer-events:auto;cursor:pointer;border:2px solid #3d5f8f;border-radius:8px;padding:18px 14px;
 text-align:center;transition:.12s;background:#101827}
.mapcard:hover{border-color:#8fd8ff;box-shadow:0 0 20px #58c8ff44;transform:translateY(-2px)}
.mapcard .mname{font-size:21px;font-weight:800;letter-spacing:1px}
.mapcard .mboss{color:#f2a06e;font-size:14px;margin-top:6px}
.mapcard .mbest{color:#9db4d6;font-size:13px;margin-top:8px}
.row{display:flex;align-items:center;gap:14px;width:min(440px,86vw)}
.row label{width:90px;text-align:right;color:#bcd2ee;font-size:17px}
input[type=range]{flex:1;accent-color:#7fd0ff;cursor:pointer;pointer-events:auto}
.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.card{pointer-events:auto;width:250px;min-height:280px;cursor:pointer;border:2px solid #33507c;border-radius:10px;
 background:linear-gradient(180deg,#111b30f8,#0a0f1cf8);padding:22px 16px;text-align:center;transition:.12s}

   VampFrost — complete single-file game. Everything (art + audio)
   is generated at runtime in code. No external files. Steam-safe.
   ================================================================ */

// ---------------- helpers ----------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const clamp01 = v => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp01((v - a) / (b - a));
const moveTo = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = n => (Math.random() * n) | 0;
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

// deterministic rng (for generated art / noise)
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// colors stored as [r,g,b] floats 0..1
const css = (c, a = 1) => `rgba(${(c[0] * 255) | 0},${(c[1] * 255) | 0},${(c[2] * 255) | 0},${a})`;
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const BLACK = [0, 0, 0], WHITE = [1, 1, 1];

// ---------------- event bus (ALL gameplay -> audio/UI flows through here) ----------------
const Events = (() => {
  const m = new Map();
  return {
    on(n, f) { if (!m.has(n)) m.set(n, []); m.get(n).push(f); },
    emit(n, a, b) { const l = m.get(n); if (l) for (const f of l) f(a, b); }
  };
})();

// ---------------- save system (JSON in localStorage) ----------------
const SAVE = (() => {
  const KEY = 'vampfrost_save';
  const d = {
    master: .8, music: .75, sfx: .9, ui: .8,
    muteMaster: false, muteMusic: false, muteSfx: false, muteUi: false,
    gold: 0, bestWave: [0, 0, 0, 0, 0, 0], runsPlayed: 0
  };
  try {
    const j = JSON.parse(localStorage.getItem(KEY));
    if (j) Object.assign(d, j);
    if (!Array.isArray(d.bestWave) || d.bestWave.length < 6) d.bestWave = [0, 0, 0, 0, 0, 0];
  } catch (e) { /* fresh save */ }
  return { data: d, save() { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} } };
})();

// ---------------- input ----------------
const Input = (() => {
  const down = new Set(), pressed = new Set();
  addEventListener('keydown', e => {
    if (!e.repeat) { down.add(e.code); pressed.add(e.code); }
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  });
  addEventListener('keyup', e => down.delete(e.code));
  addEventListener('blur', () => down.clear());
  return {
    down, pressed,
    axis() {
      let x = 0, y = 0;
      if (down.has('KeyA') || down.has('ArrowLeft')) x--;
      if (down.has('KeyD') || down.has('ArrowRight')) x++;
      if (down.has('KeyW') || down.has('ArrowUp')) y--;
      if (down.has('KeyS') || down.has('ArrowDown')) y++;
      const m = Math.hypot(x, y);
      return m > 1 ? [x / m, y / m] : [x, y];
    },
    clear() { pressed.clear(); }
  };
})();

// draw sprite in world space (ctx already transformed to world units)
function drawSpr(g, s, x, y, o = {}) {
  g.save();
  g.translate(x, y);
  if (o.rot) g.rotate(o.rot);
  if (o.flip) g.scale(-1, 1);
  const sc = (o.scale || 1) / s.ppu;
  g.scale(sc * (o.sx || 1), sc);

  g.drawImage(s.c, -s.ax, -s.ay);

// ================================================================

// ---------------- player ----------------
function makePlayer() {
  const p = {
    x: 0, y: 0, hp: 100, dead: false, invisible: false,
    S: { maxHP: 100, regen: 0, armor: 0, moveSpeed: 5, might: 1, cooldown: 1, area: 1,
         projSpeed: 1, duration: 1, amount: 0, magnet: 1.7, crit: .05, critMult: 1.6,
         goldMul: 1, dashCd: 2.5 },
    passives: {}, weapons: [],
    facing: [1, 0], move: [0, 0], flip: false,
    dashT: 0, dashCdT: 0, dashDir: [1, 0], invisT: 0, invisCdT: 0, iframes: 0, footT: 0,
    level: 1, xp: 0, xpNext: 8 + 9,
    heal(h) { if (!this.dead) this.hp = Math.min(this.S.maxHP, this.hp + h); },
    takeDamage(d) {
      if (this.dead || this.iframes > 0 || this.dashT > 0) return;
      d = Math.max(1, d - this.S.armor);
      this.hp -= d;
      this.iframes = .35;
      Events.emit('playerDamage', d);
      camShake(.13, .15);
      if (this.hp <= 0) { this.hp = 0; this.dead = true; Events.emit('playerDeath'); }
    },
    addXP(v) {
      this.xp += v;
      Events.emit('xpGained');
      while (this.xp >= this.xpNext) {
        this.xp -= this.xpNext;
        this.level++;
        this.xpNext = 8 + this.level * 9;
        Events.emit('levelUp', this.level);
        Game.pendingLevelUps++;
      }
    }
  };
  p.hp = p.S.maxHP;
  return p;
}

function playerUpdate(p, dt) {
  if (p.dead) return;
  const inp = Input.axis();
  p.move = inp;
  if (inp[0] || inp[1]) { const m = Math.hypot(inp[0], inp[1]); p.facing = [inp[0] / m, inp[1] / m]; }

  p.dashCdT -= dt; p.invisCdT -= dt; p.iframes -= dt;

  if ((Input.pressed.has('Space') || Input.pressed.has('ShiftLeft') || Input.pressed.has('ShiftRight')) && p.dashCdT <= 0) {
    p.dashT = .16; p.dashCdT = p.S.dashCd;
    p.dashDir = (inp[0] || inp[1]) ? [...p.facing] : [...p.facing];
    p.iframes = Math.max(p.iframes, .3);
    Events.emit('playerDash');
  }
  if (Input.pressed.has('KeyQ') && p.invisCdT <= 0 && p.invisT <= 0) {
    p.invisT = 3; p.invisCdT = 10;
    Events.emit('playerInvis');
  }
  if (p.invisT > 0) { p.invisT -= dt; p.invisible = true; } else p.invisible = false;

  let vx, vy;
  if (p.dashT > 0) { p.dashT -= dt; vx = p.dashDir[0] * p.S.moveSpeed * 3.4; vy = p.dashDir[1] * p.S.moveSpeed * 3.4; }
  else { vx = inp[0] * p.S.moveSpeed; vy = inp[1] * p.S.moveSpeed; }
  p.x += vx * dt; p.y += vy * dt;

  if (p.S.regen > 0) p.heal(p.S.regen * dt);

  if ((inp[0] || inp[1]) && p.dashT <= 0) {
    p.footT -= dt;
    if (p.footT <= 0) { p.footT = .34; Events.emit('footstep'); }
  }

}

// ---------------- weapons ----------------
const wInst = id => ({ id, lvl: 1, cdT: 0, orbs: [] });
const wD = w => WEAPONS[w.id];
const wDmgMul = w => 1 + .18 * (w.lvl - 1);
const wAreaMul = w => 1 + .08 * (w.lvl - 1);
const wCount = (w, s) => (wD(w).count || 1)
  + (wD(w).grow ? (w.lvl >= 3 ? 1 : 0) + (w.lvl >= 6 ? 1 : 0) : 0)
  + (wD(w).useAmt ? s.amount : 0);
const wCd = (w, s) => wD(w).cd * Math.pow(.96, w.lvl - 1) * s.cooldown;
const wDmg = (w, s) => wD(w).dmg * wDmgMul(w) * s.might;
const wSpd = (w, s) => wD(w).speed * s.projSpeed;
const wArea = (w, s) => (wD(w).area || 1) * wAreaMul(w) * s.area;

function weaponOwned(p, id) { return p.weapons.some(w => w.id === id); }

    w = wInst(id);
    p.weapons.push(w);
  } else if (w.lvl < MAX_WLVL) w.lvl++;
  if (id === 10) p.S.dashCd = 2.5 * Math.pow(.9, w.lvl); // Bite Dash
  if (wD(w).beh === 'orbit') { for (const o of w.orbs) o.dead = true; w.orbs = []; }

}

function nearestEnemy(p, maxR = 14) {
  let best = null, bd = maxR * maxR;

    if (e.dead) continue;

  }

}
function randomEnemy(p, maxR = 9) {

  for (const e of Game.enemies) {
    if (e.dead || dist2(e.x, e.y, p.x, p.y) > r2) continue;
    if (randi(++seen) === 0) pick = e;

function aimDir(p, w) {
  switch (wD(w).aim) {

      if (n) { const d = Math.hypot(n.x - p.x, n.y - p.y) || 1; return { dir: [(n.x - p.x) / d, (n.y - p.y) / d], tx: n.x, ty: n.y }; }

      const r = randomEnemy(p);
      if (r) { const d = Math.hypot(r.x - p.x, r.y - p.y) || 1; return { dir: [(r.x - p.x) / d, (r.y - p.y) / d], tx: r.x, ty: r.y }; }

function weaponsUpdate(p, dt) {

// ---------------- projectiles ----------------

function projBlast(pr) {

function projUpdate(pr, dt) {

  }

  if (pr.spin) pr.rot += pr.spin * Math.PI / 180 * dt;

  // collisions
  if (pr.friendly) projHitEnemies(pr, dt);
  else projHitPlayer(pr, p);

  if (pr.life <= 0 && pr.beh !== 'orbit') pr.dead = true;
}

function projHitEnemies(pr, dt) {
  switch (pr.beh) {
    case 'straight': case 'boomerang':
      for (const e of Game.enemies) {
        if (e.dead || pr.hitSet.has(e)) continue;
        const r = pr.hitR + e.radius;
        if (dist2(e.x, e.y, pr.x, pr.y) < r * r) {
          pr.hitSet.add(e);
          enemyTakeDamage(e, pr.dmg, pr.critC, pr.critM, pr.frost, pr.steal, pr.x, pr.y);
          if (--pr.pierce < 0 && pr.beh === 'straight') { pr.dead = true; return; }
        }
      }
      break;
    case 'orbit': case 'orbitout': {
      pr.tick -= dt;
      if (pr.tick <= 0) {
        let any = false;
        for (const e of Game.enemies) {
          if (e.dead) continue;
          const r = pr.hitR + e.radius;
          if (dist2(e.x, e.y, pr.x, pr.y) < r * r) {
            enemyTakeDamage(e, pr.dmg, pr.critC, pr.critM, pr.frost, pr.steal, pr.x, pr.y);
            any = true;
          }
        }
        if (any) pr.tick = pr.hitInterval;
      }
      break;
    }
    case 'arc':
      for (const e of Game.enemies) {
        if (e.dead || pr.hitSet.has(e)) continue;
        const r = pr.hitR + e.radius;
        if (dist2(e.x, e.y, pr.x, pr.y) < r * r) {
          pr.hitSet.add(e);
          enemyTakeDamage(e, pr.dmg, pr.critC, pr.critM, pr.frost, pr.steal, pr.x, pr.y);
        }
      }
      break;
    case 'pool':
      pr.tick -= dt;
      if (pr.tick <= 0) {
        pr.tick = pr.hitInterval;
        for (const e of Game.enemies) {
          if (e.dead) continue;
          const r = pr.hitR + e.radius;
          if (dist2(e.x, e.y, pr.x, pr.y) < r * r)
            enemyTakeDamage(e, pr.dmg, pr.critC, pr.critM, pr.frost, pr.steal, pr.x, pr.y);
        }
      }
      break;
    case 'ring':
      for (const e of Game.enemies) {
        if (e.dead || pr.hitSet.has(e)) continue;
        const d = Math.hypot(e.x - pr.x, e.y - pr.y);
        if (Math.abs(d - pr.ringR) < .45 + e.radius) {
          pr.hitSet.add(e);
          enemyTakeDamage(e, pr.dmg, pr.critC, pr.critM, pr.frost, pr.steal, pr.x, pr.y);
        }
      }
      break;
  }
}

function projHitPlayer(pr, p) {
  if (!p || p.dead) return;
  if (pr.beh === 'ring') {
    if (pr.ringHitPlayer) return;
    const d = Math.hypot(p.x - pr.x, p.y - pr.y);
    if (Math.abs(d - pr.ringR) < .5) { pr.ringHitPlayer = true; p.takeDamage(pr.dmg); }
  } else {
    const r = pr.hitR + .3;
    if (dist2(p.x, p.y, pr.x, pr.y) < r * r) { p.takeDamage(pr.dmg); pr.dead = true; }
  }
}

// ---------------- enemies ----------------
let sepCursor = 0;
function spawnEnemy(d, x, y, wave, elite) {
  const hs = 1 + (wave - 1) * .45, ds = 1 + (wave - 1) * .16;
  const e = {
    d, x, y, elite, boss: false, dead: false,
    maxhp: d.hp * hs * (elite ? 10 : 1), dmg: d.dmg * ds * (elite ? 1.8 : 1),
    spd: d.speed * (1 + wave * .015) * (elite ? 1.05 : 1),
    radius: d.radius * (elite ? 1.5 : 1),
    scale: (elite ? 1.5 : 1) * d.size,
    animSeed: rand(10),
    atkCd: 0, hitFlashT: 0, slowT: 0, freezeT: 0, frostStackT: 0, frostStacks: 0,
    knx: 0, kny: 0, fireT: d.ranged ? rand(1, d.fireCd) : 0, telegraphed: false,
    tickT: rand(1, 4), flip: false
  };
  e.hp = e.maxhp;
  Game.enemies.push(e);
  Events.emit('enemySpawn', e);
  return e;
}

function enemyUpdate(e, dt) {
  const p = Game.player;
  if (!p) return;
  e.hitFlashT -= dt; e.slowT -= dt; e.frostStackT -= dt; e.atkCd -= dt;
  if (e.frostStackT <= 0) e.frostStacks = 0;
  if (e.freezeT > 0) e.freezeT -= dt;

  const tx = p.x - e.x, ty = p.y - e.y;
  const dist = Math.hypot(tx, ty) || .001;
  const dx = tx / dist, dy = ty / dist;

  e.tickT -= dt;
  if (e.tickT <= 0 && dist < 9) { e.tickT = rand(2.5, 6); Events.emit('enemyTick'); }

  if (e.freezeT <= 0) {
    const spd = e.spd * (e.slowT > 0 ? .45 : 1);
    let mx, my;
    const seed = e.tickT * 137 + e.maxhp; // stable-ish per enemy
    if (p.invisible) { mx = Math.sin(performance.now() / 1000 * .7 + seed) * .4; my = Math.cos(performance.now() / 1000 * .6 + seed) * .4; }
    else if (e.d.ranged && dist < e.d.range * .55) { mx = -dx; my = -dy; }
    else if (e.d.ranged && dist < e.d.range) { const side = (e.maxhp | 0) & 1 ? 1 : -1; mx = -dy * side * .5; my = dx * side * .5; }
    else { mx = dx; my = dy; }

    // cheap separation: one neighbour per enemy per frame
    const list = Game.enemies;
    if (list.length > 1) {
      sepCursor = (sepCursor + 1) % list.length;
      const o = list[sepCursor];
      if (o !== e && !o.dead) {
        const sx = e.x - o.x, sy = e.y - o.y, m = Math.hypot(sx, sy);
        const min = (e.radius + o.radius) * 1.4;
        if (m > .001 && m < min) { mx += sx / m * (min - m) * 2; my += sy / m * (min - m) * 2; }
      }
    }
    const mm = Math.hypot(mx, my) || 1;
    e.x += (mx / mm * spd + e.knx) * dt;
    e.y += (my / mm * spd + e.kny) * dt;

    if (e.d.ranged && !p.invisible && dist < e.d.range) {
      e.fireT -= dt;
      if (e.fireT <= .45 && !e.telegraphed) { e.telegraphed = true; Events.emit('enemyTelegraph'); }
      if (e.fireT <= 0) {
        e.telegraphed = false; e.fireT = e.d.fireCd;
        spawnHostile(e.x, e.y, [dx, dy], e.dmg, e.d.projSpeed, 3, mix(e.d.color, WHITE, .3), 1);
      }
    }
    if (!p.invisible && dist < e.radius + .32 && e.atkCd <= 0) { e.atkCd = .65; p.takeDamage(e.dmg); }
  }

  e.knx = moveTo(e.knx, 0, 18 * dt); e.kny = moveTo(e.kny, 0, 18 * dt);

  if (dist > 26) { // teleport back around player (VS style)
    const a = rand(TAU);
    e.x = p.x + Math.cos(a) * 13; e.y = p.y + Math.sin(a) * 13;
  }
  e.flip = dx < 0;
}

function enemyTakeDamage(e, dmg, critC, critM, frost, steal, sx, sy) {
  if (e.boss && e.invulnT > 0) return;
  if (e.boss) frost *= .3; // bosses resist freeze
  const crit = Math.random() < critC;
  const final = dmg * (crit ? critM : 1);
  e.hp -= final;
  e.hitFlashT = .07;
  Events.emit('hit', crit);
  spawnText(e.x, e.y - .5, Math.round(final).toString(), crit);

  if (steal > 0 && Game.player) Game.player.heal(final * steal);

  const kx = e.x - sx, ky = e.y - sy, m = Math.hypot(kx, ky) || 1;
  if (!e.boss) {
    const kk = (crit ? 4.5 : 2.5) / Math.max(1, e.scale);
    e.knx += kx / m * kk; e.kny += ky / m * kk;
  }
  if (frost > 0 && Math.random() < frost) {
    e.slowT = Math.max(e.slowT, 2);
    e.frostStacks++; e.frostStackT = 2;
    if (e.frostStacks >= 3 && e.freezeT <= 0) {
      e.freezeT = 1.2; e.frostStacks = 0;
      Events.emit('freezeApplied');
    }
  }
  if (e.hp <= 0) (e.boss ? bossDie : enemyDie)(e);
}

function enemyDie(e) {
  if (e.dead) return;
  e.dead = true;
  const wave = Game.wave;
  spawnGem(e.x, e.y, e.d.xp * (1 + wave * .15));
  if (Math.random() < .08) spawnGold(e.x, e.y, 1 + (wave / 5 | 0));
  if (Math.random() < .02) Game.hearts.push({ x: e.x, y: e.y });
  if (e.elite) Game.chests.push({ x: e.x, y: e.y });
  Events.emit('enemyDeath', e);
}

// ---------------- bosses ----------------
function spawnBoss(bd, x, y, mini) {
  const b = {
    d: { key: bd.key, name: bd.name, color: bd.color, xp: 30 }, bd, mini,
    x, y, boss: true, dead: false, elite: false,
    maxhp: bd.hp, hp: bd.hp, dmg: bd.dmg, spd: bd.speed,
    radius: .55 * bd.size, scale: bd.size,
    animSeed: rand(10),
    phase: 1, invulnT: 0, atkCd: 0, hitFlashT: 0,
    slowT: 0, freezeT: 0, frostStackT: 0, frostStacks: 0, knx: 0, kny: 0,
    tS: 0, tR: 0, tB: 0, tC: 0, tT: 0, tRing: 0, tA: 0,
    chargeT: 0, chargeDir: [1, 0], flip: false
  };
  Game.enemies.push(b);
  Game.boss = b;
  Events.emit('bossSpawn', b);
  camShake(.25, .4);
  return b;
}

function bossUpdate(b, dt) {
  const p = Game.player;
  if (!p) return;
  b.invulnT -= dt; b.hitFlashT -= dt;
  const ph = b.bd.phases[b.phase - 1];

  const tx = p.x - b.x, ty = p.y - b.y;
  const dist = Math.hypot(tx, ty) || .001;
  const dx = tx / dist, dy = ty / dist;
  const spd = b.spd * ph.spd;

  if (b.chargeT > 0) {
    b.chargeT -= dt;
    b.x += b.chargeDir[0] * spd * 4.2 * dt; b.y += b.chargeDir[1] * spd * 4.2 * dt;
    if (!p.invisible && dist < b.radius + .35 && b.atkCd <= 0) { b.atkCd = .5; p.takeDamage(b.dmg * 1.5); }
  } else {
    if (!p.invisible) { b.x += dx * spd * dt; b.y += dy * spd * dt; }
    b.atkCd -= dt;
    if (!p.invisible && dist < b.radius + .35 && b.atkCd <= 0) { b.atkCd = .7; p.takeDamage(b.dmg); }
  }

  const tick = (key, every, fn) => {
    if (every <= 0) return;
    b[key] += dt;
    if (b[key] >= every) { b[key] = 0; fn(); }
  };

  tick('tS', ph.summon, () => {
    const n = 2 + b.phase;
    for (let i = 0; i < n; i++) {
      const a = rand(TAU);
      spawnEnemy(MOBS[ph.summonId], b.x + Math.cos(a) * 1.6, b.y + Math.sin(a) * 1.6, Game.wave, false);
    }
  });
  tick('tR', ph.radialE, () => {
    for (let i = 0; i < ph.radialC; i++) {
      const a = i * TAU / ph.radialC + performance.now() / 1000;
      spawnHostile(b.x, b.y, [Math.cos(a), Math.sin(a)], b.dmg * .7, 5.5, 3.5, b.bd.color, 1.1);
    }
  });
  tick('tB', ph.burstE, () => {
    for (let i = 0; i < ph.burstC; i++) {
      const spread = (i - (ph.burstC - 1) * .5) * .12;
      const c = Math.cos(spread), s = Math.sin(spread);
      spawnHostile(b.x, b.y, [dx * c - dy * s, dx * s + dy * c], b.dmg * .6, 8, 2.5, mix(b.bd.color, WHITE, .3), .9);
    }
  });
  tick('tC', ph.charge, () => {
    b.chargeDir = [dx, dy]; b.chargeT = .55;
    Events.emit('bossHeavy');
    camShake(.18, .3);
  });
  tick('tT', ph.tele, () => {
    Events.emit('enemyTelegraph');
    const a = rand(TAU), r = rand(2.5, 4);
    b.x = p.x + Math.cos(a) * r; b.y = p.y + Math.sin(a) * r;
  });
  tick('tRing', ph.ring, () => {
    spawnHostile(b.x, b.y, [1, 0], b.dmg * .8, 6, 1.4, b.bd.color, 1, 'ring');
    Events.emit('bossHeavy');
  });
  tick('tA', ph.aoe, () => {
    Game.aoes.push({ x: p.x, y: p.y, t: 0, warn: .9, r: 1.9, dmg: b.dmg * 1.2 });
  });

  b.flip = dx < 0;
}

function bossPhaseCheck(b) {
  if (b.hp <= 0) return;
  const f = b.hp / b.maxhp;
  const wanted = f > 2 / 3 ? 1 : f > 1 / 3 ? 2 : 3;
  if (wanted > b.phase) {
    b.phase = wanted;
    b.invulnT = 1;
    Events.emit('bossPhase', b.phase);
    camShake(.2, .5);
  }
}

function bossDie(b) {
  if (b.dead) return;
  b.dead = true;
  for (let i = 0; i < (b.mini ? 8 : 20); i++) {
    const a = rand(TAU), r = rand(1.2);
    spawnGem(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r, 6);
  }
  spawnGold(b.x, b.y, b.mini ? 40 : 120);
  Game.chests.push({ x: b.x, y: b.y });
  if (Game.boss === b) Game.boss = null;
  Events.emit('bossDeath', b.mini);
  camShake(.35, .6);
}

// ---------------- pickups & floating text ----------------
function spawnGem(x, y, v) {
  Game.gems.push({ x: x + rand(-.15, .15), y: y + rand(-.15, .15), v, pull: 0, big: v >= 5 });
}
function spawnGold(x, y, v) {
  Game.golds.push({ x: x + rand(-.2, .2), y: y + rand(-.2, .2), v, pull: 0 });
}
function spawnText(x, y, str, crit) {
  Game.texts.push({ x: x + rand(-.2, .2), y, t: .55, str, crit });
  if (Game.texts.length > 80) Game.texts.shift();
}

function pickupsUpdate(dt) {
  const p = Game.player;
  if (!p || p.dead) return;
  for (const g of Game.gems) {
    const tx = p.x - g.x, ty = p.y - g.y, d = Math.hypot(tx, ty);
    if (d < p.S.magnet) {
      g.pull = Math.min(14, g.pull + 40 * dt);
      g.x += tx / (d || 1) * g.pull * dt; g.y += ty / (d || 1) * g.pull * dt;
    }
    if (d < .35) { g.dead = true; p.addXP(g.v); }
  }
  for (const g of Game.golds) {
    const tx = p.x - g.x, ty = p.y - g.y, d = Math.hypot(tx, ty);
    if (d < p.S.magnet) {
      g.pull = Math.min(13, g.pull + 36 * dt);
      g.x += tx / (d || 1) * g.pull * dt; g.y += ty / (d || 1) * g.pull * dt;
    }
    if (d < .35) { g.dead = true; Game.addGold(Math.round(g.v * p.S.goldMul)); }
  }
  for (const h of Game.hearts) {
    if (dist2(p.x, p.y, h.x, h.y) < .45 * .45) {
      h.dead = true; p.heal(p.S.maxHP * .25);
      Events.emit('healthPickup');
    }
  }
  for (const c of Game.chests) {
    if (dist2(p.x, p.y, c.x, c.y) < .6 * .6) {
      c.dead = true;
      Events.emit('chestOpen');
      const rolls = Math.random() < .05 ? 3 : Math.random() < .3 ? 2 : 1;
      let txt = '';
      for (let i = 0; i < rolls; i++) txt += (i > 0 ? '  +  ' : '') + Upgrades.grantRandom();
      Game.addGold(25);
      UI.toast('Chest: ' + txt);
    }
  }
  Game.gems = Game.gems.filter(g => !g.dead);
  Game.golds = Game.golds.filter(g => !g.dead);
  Game.hearts = Game.hearts.filter(h => !h.dead);
  Game.chests = Game.chests.filter(c => !c.dead);
}

// ---------------- level-up upgrade pool ----------------
const Upgrades = {
  roll(n) {
    const p = Game.player;
    const pool = [];
    for (let id = 0; id < WEAPONS.length; id++) {
      const d = WEAPONS[id], lv = weaponLevel(p, id);
      if (lv === 0 && p.weapons.length < 6)
        pool.push({ c: { title: 'NEW  ' + d.name, desc: d.desc, apply: () => weaponAddOrUpgrade(p, id) }, w: 8 });
      else if (lv > 0 && lv < MAX_WLVL)
        pool.push({ c: { title: `${d.name}  Lv${lv + 1}`,
          desc: '+18% damage' + (d.grow && (lv + 1 === 3 || lv + 1 === 6) ? ', +1 projectile' : ''),
          apply: () => weaponAddOrUpgrade(p, id) }, w: 10 });
    }
    for (const ps of PASSIVES) {
      const lv = p.passives[ps.key] || 0;
      if (lv >= ps.cap) continue;
      pool.push({ c: { title: `${ps.title}  ${'I'.repeat(lv + 1)}`, desc: ps.desc,
        apply: () => { ps.apply(p.S); p.passives[ps.key] = (p.passives[ps.key] || 0) + 1; } }, w: ps.weight });
    }
    const picks = [];
    for (let i = 0; i < n && pool.length > 0; i++) {
      let total = 0; for (const e of pool) total += e.w;
      let r = randi(total);
      for (let j = 0; j < pool.length; j++) {
        r -= pool[j].w;
        if (r < 0) { picks.push(pool[j].c); pool.splice(j, 1); break; }
      }
    }
    return picks;
  },
  grantRandom() {
    const one = this.roll(1);
    if (!one.length) return 'Gold!';
    one[0].apply();
    return one[0].title;
  }
};
// ================================================================
//  GAME — state machine, world chunks, waves, camera, rendering
// ================================================================
const cam = { x: 0, y: 0, shA: 0, shT: 0 };
function camShake(amp, dur) { cam.shA = Math.max(cam.shA, amp); cam.shT = Math.max(cam.shT, dur); }

const Game = {
  MAX_WAVE: 20, WAVE_DUR: 45,
  state: 'menu', map: MAPS[0], wave: 1, runTime: 0, goldRun: 0,
  player: null, enemies: [], projs: [], gems: [], golds: [], hearts: [], chests: [], texts: [], aoes: [],
  boss: null, pendingLevelUps: 0, timeScale: 1, ending: null, persisted: false,
  chunks: new Map(), tiles: [],
  spawn: { t: 0, lastWave: 0, finalBossOut: false, miniOut: false },
  hud: { toastT: 0, toastStr: '', hintT: 0 },

  addGold(v) { this.goldRun += v; Events.emit('goldGained', v); },

  startRun(mapId) {
    this.map = MAPS[mapId];
    this.state = 'playing';
    this.wave = 1; this.runTime = 0; this.goldRun = 0;
    this.timeScale = 1; this.ending = null; this.persisted = false;
    this.enemies = []; this.projs = []; this.gems = []; this.golds = [];
    this.hearts = []; this.chests = []; this.texts = []; this.aoes = [];
    this.boss = null; this.pendingLevelUps = 0;
    this.chunks.clear();
    this.tiles = [
      Sprites.tile(this.map.groundA, this.map.id * 7919 + 13),
      Sprites.tile(this.map.groundB, this.map.id * 7919 + 14),
      Sprites.tile(this.map.groundA, this.map.id * 7919 + 15),
      Sprites.tile(this.map.groundB, this.map.id * 7919 + 16)];
    this.spawn = { t: 0, lastWave: 0, finalBossOut: false, miniOut: false };
    this.player = makePlayer();
    weaponAddOrUpgrade(this.player, 0); // starting weapon: Icicle Spike
    cam.x = cam.y = 0; cam.shA = cam.shT = 0;
    this.hud.hintT = 12; this.hud.toastT = 0;
    UI.hideAll();
    Events.emit('runStart');
  },

  persistRun() {
    if (this.persisted) return;
    this.persisted = true;
    SAVE.data.gold += this.goldRun;
    SAVE.data.runsPlayed++;
    SAVE.save();
  },

  endToMenu() {
    if (this.runTime > 0) this.persistRun();
    this.state = 'menu';
    this.timeScale = 1; this.ending = null;
    this.enemies = []; this.projs = []; this.gems = []; this.golds = [];
    this.hearts = []; this.chests = []; this.texts = []; this.aoes = [];
    this.boss = null; this.player = null; this.pendingLevelUps = 0;
    this.chunks.clear();
    Events.emit('runEnd');
    UI.showMain();
  },

  setPause(on) {
    if (on && this.state !== 'playing') return;
    if (!on && this.state !== 'paused') return;
    this.state = on ? 'paused' : 'playing';
    UI.showPause(on);
    Events.emit('pause', on);
  },

  // ---------------- per-frame ----------------
  update(rdt) {
    const st = this.state;

    if (st === 'playing') {
      if (Input.pressed.has('Escape') && this.player && !this.player.dead && !this.ending) this.setPause(true);

      const dt = rdt * this.timeScale;
      this.runTime += dt;
      this.wave = clamp(1 + (this.runTime / this.WAVE_DUR | 0), 1, this.MAX_WAVE);

      this.waveLogic(dt);

      const p = this.player;
      if (p) { playerUpdate(p, dt); if (!p.dead) weaponsUpdate(p, dt); }

      for (const pr of this.projs) if (!pr.dead) projUpdate(pr, dt);
      this.projs = this.projs.filter(pr => !pr.dead);

      for (const e of this.enemies) if (!e.dead) (e.boss ? bossUpdate : enemyUpdate)(e, dt);
      this.enemies = this.enemies.filter(e => !e.dead);

      pickupsUpdate(dt);

      for (const a of this.aoes) {
        a.t += dt;
        if (a.t >= a.warn && !a.done) {
          a.done = true;
          Events.emit('bossHeavy'); Events.emit('explosion');
          camShake(.22, .25);
          if (p && !p.invisible && !p.dead && dist2(p.x, p.y, a.x, a.y) < a.r * a.r) p.takeDamage(a.dmg);
        }
      }
      this.aoes = this.aoes.filter(a => !a.done);

      for (const t of this.texts) { t.t -= rdt; t.y -= 1.4 * rdt; }
      this.texts = this.texts.filter(t => t.t > 0);

      // level-up interrupts (not during an ending)
      if (this.pendingLevelUps > 0 && !this.ending && p && !p.dead) {
        this.state = 'levelup';
        UI.showLevelUp();
      }

      // ending sequences
      if (this.ending) {
        this.ending.t -= rdt;
        if (this.ending.t <= 0) {
          const v = this.ending.type === 'victory';
          this.state = v ? 'victory' : 'gameover';
          this.ending = null;
          this.persistRun();
          UI.showEnd(v);
        }
      }
    } else if (st === 'paused') {
      if (Input.pressed.has('Escape') && !UI.closeSettingsIfOpen()) this.setPause(false);
    }

    // camera (real time so it settles even in slow-mo)
    const p = this.player;
    if (p && (st === 'playing' || st === 'levelup' || st === 'paused')) {
      cam.x = lerp(cam.x, p.x, clamp01(8 * rdt));
      cam.y = lerp(cam.y, p.y, clamp01(8 * rdt));
    }
    if (cam.shT > 0) { cam.shT -= rdt; if (cam.shT <= 0) cam.shA = 0; }

    // hud timers
    if (this.hud.toastT > 0) this.hud.toastT -= rdt;
    if (this.hud.hintT > 0) this.hud.hintT -= rdt;

    // ---- feed the audio intensity controller ----
    const inRun = st === 'playing' || st === 'levelup' || st === 'paused';
    let near = 0;
    if (p && inRun) for (const e of this.enemies) if (!e.dead && dist2(e.x, e.y, p.x, p.y) < 64) near++;
    SND.frame(rdt, {
      inRun, paused: st === 'paused',
      enemies: this.enemies.length, near,
      hp01: p ? clamp01(p.hp / p.S.maxHP) : 1,
      bossActive: !!this.boss, phase: this.boss ? this.boss.phase : 0,
      wave01: this.wave / this.MAX_WAVE,
      mapRev: this.map.rev
    });
  },

  // ---------------- wave spawner ----------------
  waveLogic(dt) {
    const sp = this.spawn, map = this.map, wave = this.wave;

    if (wave !== sp.lastWave) {
      if (sp.lastWave > 0) Events.emit('waveEnd', sp.lastWave);
      sp.lastWave = wave;
      Events.emit('waveStart', wave);
      if (wave > 1) UI.toast('Wave ' + wave);
      if (wave > SAVE.data.bestWave[map.id]) { SAVE.data.bestWave[map.id] = wave; SAVE.save(); }

      if (wave % 5 === 0 && wave < this.MAX_WAVE) {
        if (map.id === 4 && wave === 15 && !sp.miniOut) { sp.miniOut = true; spawnBoss(BOSSES[5], ...ringPos(), true); }
        else { const [x, y] = ringPos(); spawnEnemy(MOBS[map.mobs[randi(map.mobs.length)]], x, y, wave, true); }
      }
      if (wave >= this.MAX_WAVE && !sp.finalBossOut) {
        sp.finalBossOut = true;
        spawnBoss(BOSSES[map.bossId], ...ringPos(), false);
      }
    }

    if (sp.finalBossOut) return; // full attention on the boss

    sp.t -= dt;
    if (sp.t <= 0 && this.enemies.length < Math.min(240, 50 + wave * 10)) {
      sp.t = Math.max(.12, 1.15 - wave * .05);
      const batch = 1 + (wave / 6 | 0);
      for (let i = 0; i < batch; i++) {
        const idx = Math.random() < .55 ? 0 : Math.random() < .7 ? 1 : 2;
        const [x, y] = ringPos();
        spawnEnemy(MOBS[map.mobs[idx]], x, y, wave, false);
      }
    }
  }
};

function ringPos() {
  const p = Game.player, a = rand(TAU), r = rand(12, 14);
  return [(p ? p.x : 0) + Math.cos(a) * r, (p ? p.y : 0) + Math.sin(a) * r];
}

// boss victory / player death -> ending sequences
Events.on('bossDeath', mini => {
  if (mini || Game.state !== 'playing') return;
  Game.ending = { type: 'victory', t: 1.6 };
  Events.emit('victory');
});
Events.on('playerDeath', () => {
  if (Game.state !== 'playing' && Game.state !== 'levelup') return;
  Game.state = 'playing';
  Game.ending = { type: 'gameover', t: 1.1 };
  Game.timeScale = .3;
  Events.emit('gameOver');
});

// ================================================================
//  RENDERING
// ================================================================
const canvas = document.getElementById('game');
const g2d = canvas.getContext('2d');

function chunkKey(cx, cy) { return cx + ',' + cy; }
function buildChunk(cx, cy) {
  const CH = 8, TP = 16; // 8 tiles of 16px
  const c = document.createElement('canvas');
  c.width = c.height = CH * TP;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const rng = mulberry((cx * 73856093 ^ cy * 19349663 ^ (Game.map.id * 7919 + 13)) >>> 0);
  for (let x = 0; x < CH; x++) for (let y = 0; y < CH; y++)
    g.drawImage(Game.tiles[(rng() * 4) | 0].c, x * TP, y * TP);
  const n = (rng() * 4) | 0;
  for (let i = 0; i < n; i++) {
    const shape = Game.map.shapes[(rng() * Game.map.shapes.length) | 0];
    const s = Sprites.deco(shape, Game.map.decoA, Game.map.decoB);
    const k = TP / s.ppu;
    const px = rng() * CH * TP, py = rng() * CH * TP;
    g.drawImage(s.c, px - s.ax * k, py - s.ay * k, s.c.width * k, s.c.height * k);
  }
  return c;
}

function render() {
  const W = canvas.width, H = canvas.height;
  const now = performance.now() / 1000;
  g2d.imageSmoothingEnabled = false;
  const st = Game.state;
  const inRun = st === 'playing' || st === 'levelup' || st === 'paused' || !!Game.ending;

  g2d.setTransform(1, 0, 0, 1, 0, 0);
  g2d.fillStyle = css(inRun ? Game.map.bg : [.02, .025, .045]);
  g2d.fillRect(0, 0, W, H);
  if (!inRun) return;

  const Z = H / 11; // world units visible vertically
  let ox = 0, oy = 0;
  if (cam.shT > 0) { ox = rand(-1, 1) * cam.shA; oy = rand(-1, 1) * cam.shA; }
  g2d.setTransform(Z, 0, 0, Z, W / 2 - (cam.x + ox) * Z, H / 2 - (cam.y + oy) * Z);

  // ---- ground chunks ----
  const CH = 8;
  const x0 = Math.floor((cam.x - W / 2 / Z) / CH), x1 = Math.floor((cam.x + W / 2 / Z) / CH);
  const y0 = Math.floor((cam.y - H / 2 / Z) / CH), y1 = Math.floor((cam.y + H / 2 / Z) / CH);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const k = chunkKey(cx, cy);
    if (!Game.chunks.has(k)) {
      Game.chunks.set(k, buildChunk(cx, cy));
      if (Game.chunks.size > 500) { // prune far chunks
        for (const [kk] of Game.chunks) {
          const [ax, ay] = kk.split(',').map(Number);
          if (Math.abs(ax - cx) > 6 || Math.abs(ay - cy) > 6) Game.chunks.delete(kk);
          if (Game.chunks.size <= 300) break;
        }
      }
    }
    g2d.drawImage(Game.chunks.get(k), cx * CH, cy * CH, CH, CH);
  }

  // ---- AoE warnings ----
  for (const a of Game.aoes) {
    const k = clamp01(a.t / a.warn);
    g2d.strokeStyle = css([1, .3, .2], .8);
    g2d.lineWidth = .1;
    g2d.beginPath(); g2d.arc(a.x, a.y, a.r * lerp(.2, 1, k), 0, TAU); g2d.stroke();
    g2d.fillStyle = css([1, .3, .2], .1 + .12 * Math.sin(a.t * 20));
    g2d.beginPath(); g2d.arc(a.x, a.y, a.r * lerp(.2, 1, k), 0, TAU); g2d.fill();
  }

  // ---- ground-level projectiles (pools) ----
  for (const pr of Game.projs) if (pr.beh === 'pool')
    drawSpr(g2d, pr.sprite, pr.x, pr.y, { scale: pr.scale, alpha: pr.alpha });

  // ---- pickups (bobbing gems, spinning coins, pulsing hearts) ----
  for (const g of Game.gems)
    drawSpr(g2d, Sprites.gem(g.big), g.x, g.y + Math.sin(now * 3 + g.x * 7) * .05);
  for (const g of Game.golds)
    drawSpr(g2d, Sprites.coin(), g.x, g.y, { sx: Math.max(.15, Math.abs(Math.cos(now * 4 + g.x * 5))) });
  for (const h of Game.hearts)
    drawSpr(g2d, Sprites.heart(), h.x, h.y, { scale: 1 + Math.sin(now * 5) * .12 });
  for (const c of Game.chests) drawSpr(g2d, Sprites.chest(), c.x, c.y + .3);

  // ---- entities sorted by y ----
  const ents = [];
  for (const e of Game.enemies) if (!e.dead) ents.push(e);
  const p = Game.player;
  if (p) ents.push(p);
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) {
    if (e === p) {
      // shadow
      g2d.fillStyle = 'rgba(0,0,0,.35)';
      g2d.beginPath(); g2d.ellipse(p.x, p.y + .42, .34, .12, 0, 0, TAU); g2d.fill();
      const blink = p.iframes > 0 && Math.sin(now * 40) > 0;
      const moving = p.move[0] || p.move[1];
      const frame = p.dashT > 0 ? 1 : moving ? 1 + ((now * 9 | 0) % 2) : 0; // walk cycle
      const bob = moving ? 0 : Math.sin(now * 2) * .02;                     // idle breathing
      if (p.dashT > 0) // motion trail
        drawSpr(g2d, Sprites.player(1), p.x - p.dashDir[0] * .35, p.y + .45 - p.dashDir[1] * .35,
          { flip: p.flip, alpha: .25 });
      drawSpr(g2d, Sprites.player(frame), p.x, p.y + .45 + bob, {
        flip: p.flip, alpha: p.invisible ? .35 : blink ? .45 : 1
      });
    } else {
      let feet = e.y + e.radius * .9;
      if (e.d.body === 'w') feet += Math.sin(now * 3 + e.animSeed) * .07; // wraiths hover
      g2d.fillStyle = 'rgba(0,0,0,.3)';
      g2d.beginPath(); g2d.ellipse(e.x, e.y + e.radius * .9, e.radius * .95, e.radius * .34, 0, 0, TAU); g2d.fill();
      if (e.elite) {
        g2d.strokeStyle = css([1, .85, .4], .8); g2d.lineWidth = .06;
        g2d.beginPath(); g2d.ellipse(e.x, e.y + e.radius * .9, e.radius * 1.25, e.radius * .45, 0, 0, TAU); g2d.stroke();
      }
      let frame;
      if (e.boss) frame = e.chargeT > 0 ? 1 : ((now * 3 + e.animSeed) | 0) % 2;      // menace / raise
      else if (e.freezeT > 0) frame = 0;                                              // frozen solid
      else frame = 1 + (((now * 6 + e.animSeed) | 0) % 2);                            // walk cycle
      const sprite = e.boss ? Sprites.boss(e.bd, frame) : Sprites.mob(e.d, frame);
      drawSpr(g2d, sprite, e.x, feet, { flip: e.flip, scale: e.scale });
      // status overlays
      let ov = null;
      if (e.freezeT > 0) ov = css([.55, .85, 1], .45);
      else if (e.slowT > 0) ov = css([.7, .9, 1], .25);
      if (e.telegraphed && Math.sin(now * 25) > 0) ov = css([1, .4, .3], .4);
      if (e.boss && e.invulnT > 0 && Math.sin(now * 31) > 0) ov = css(e.bd.color, .5);
      if (e.hitFlashT > 0) ov = 'rgba(255,255,255,.55)';
      if (ov) {
        g2d.fillStyle = ov;
        g2d.beginPath(); g2d.arc(e.x, e.y, Math.min(e.radius * 1.1, .75), 0, TAU); g2d.fill();
      }
    }
  }

  // ---- projectiles ----
  for (const pr of Game.projs) {
    if (pr.beh === 'pool') continue;
    if (pr.beh === 'ring') {
      g2d.strokeStyle = css(pr.col, pr.alpha);
      g2d.lineWidth = .14;
      g2d.beginPath(); g2d.arc(pr.x, pr.y, pr.ringR, 0, TAU); g2d.stroke();
      continue;
    }
    drawSpr(g2d, pr.sprite, pr.x, pr.y, {
      scale: (pr.drawScale || 1) * pr.scale, alpha: pr.alpha, rot: pr.rot
    });
  }

  // ---- floating damage numbers (screen space for crispness) ----
  g2d.setTransform(1, 0, 0, 1, 0, 0);
  g2d.textAlign = 'center';
  for (const t of Game.texts) {
    const sx = (t.x - cam.x) * Z + W / 2, sy = (t.y - cam.y) * Z + H / 2;
    g2d.font = (t.crit ? 'bold 22px' : 'bold 16px') + ' monospace';
    g2d.fillStyle = t.crit ? `rgba(255,215,60,${clamp01(t.t / .3)})` : `rgba(255,244,230,${clamp01(t.t / .3)})`;
    g2d.fillText(t.str, sx, sy);
  }

  drawHUD(W, H);
}

// ---------------- HUD ----------------
function bar(x, y, w, h, frac, bg, fill) {
  g2d.fillStyle = bg; g2d.fillRect(x, y, w, h);
  g2d.fillStyle = fill; g2d.fillRect(x + 2, y + 2, (w - 4) * clamp01(frac), h - 4);
}
function drawHUD(W, H) {
  const p = Game.player;
  if (!p) return;
  g2d.textAlign = 'left';

  // HP + XP
  bar(24, 24, 320, 26, p.hp / p.S.maxHP, 'rgba(20,12,17,.9)', '#c71f2e');
  g2d.font = 'bold 15px monospace'; g2d.fillStyle = '#fff'; g2d.textAlign = 'center';
  g2d.fillText(`${Math.ceil(p.hp)} / ${Math.ceil(p.S.maxHP)}`, 24 + 160, 24 + 18);
  bar(24, 56, 320, 14, p.xp / p.xpNext, 'rgba(15,12,26,.9)', '#8c4cf2');
  g2d.textAlign = 'left';
  g2d.font = 'bold 15px monospace'; g2d.fillStyle = '#e8f2ff';
  g2d.fillText('Lv ' + p.level, 352, 68);

  // weapons list
  g2d.font = '13px monospace'; g2d.fillStyle = 'rgba(215,230,250,.85)';
  let ly = 92;
  for (const w of p.weapons) { g2d.fillText(`${wD(w).name}  Lv${w.lvl}`, 24, ly); ly += 17; }

  // cooldowns
  g2d.font = '13px monospace'; g2d.fillStyle = 'rgba(170,210,255,.9)';
  const dash = p.dashCdT > 0 ? `Dash ${p.dashCdT.toFixed(1)}s` : 'Dash READY';
  const inv = p.invisCdT > 0 ? `Invis ${p.invisCdT.toFixed(1)}s` : 'Invis READY';
  g2d.fillText(dash + '     ' + inv, 24, H - 20);

  // timer + wave (top center)
  const m = Game.runTime / 60 | 0, s = Game.runTime % 60 | 0;
  g2d.textAlign = 'center';
  g2d.font = 'bold 38px monospace'; g2d.fillStyle = '#fff';
  g2d.fillText(`${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`, W / 2, 48);
  g2d.font = '17px monospace'; g2d.fillStyle = '#8fd8ff';
  g2d.fillText(`Wave ${Game.wave} / ${Game.MAX_WAVE}`, W / 2, 74);

  // gold (top right)
  g2d.textAlign = 'right';
  g2d.font = 'bold 19px monospace'; g2d.fillStyle = '#ecc84a';
  g2d.fillText(Game.goldRun + ' g', W - 28, 42);

  // boss bar
  const b = Game.boss;
  if (b && !b.dead) {
    const bw = Math.min(700, W - 80);
    g2d.textAlign = 'center';
    g2d.font = 'bold 17px monospace'; g2d.fillStyle = '#ffa050';
    g2d.fillText(b.bd.name.toUpperCase(), W / 2, H - 62);
    bar(W / 2 - bw / 2, H - 52, bw, 18, b.hp / b.maxhp, 'rgba(26,10,10,.95)', '#ff7326');
  }

  // toast + hint
  if (Game.hud.toastT > 0) {
    g2d.textAlign = 'center';
    g2d.font = 'bold 20px monospace';
    g2d.fillStyle = `rgba(143,216,255,${clamp01(Game.hud.toastT / .6)})`;
    g2d.fillText(Game.hud.toastStr, W / 2, H - 118);
  }
  if (Game.hud.hintT > 0) {
    g2d.textAlign = 'center';
    g2d.font = '15px monospace';
    g2d.fillStyle = `rgba(255,255,255,${clamp01(Game.hud.hintT / 3) * .55})`;
    g2d.fillText('WASD move   ·   SPACE dash   ·   Q invisibility   ·   ESC pause', W / 2, H - 88);
  }
}
// ================================================================
//  UI — DOM menus (main, map select, settings, pause, level-up, end)
// ================================================================
const UI = (() => {
  const root = document.getElementById('ui');
  let scrMain, scrMaps, scrSettings, scrPause, scrLevelup, scrEnd;
  let goldTxt, endTitle, endStats, mapGrid;
  let settingsFromPause = false;
  let luChoices = [], luCards = [];

  function el(tag, cls, parent, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    (parent || root).appendChild(e);
    return e;
  }
  function btn(parent, label, onClick) {
    const b = el('div', 'btn', parent, label);
    b.addEventListener('mouseenter', () => Events.emit('uiHover'));
    b.addEventListener('click', () => { Events.emit('uiClick'); onClick(); });
    return b;
  }
  const show = s => { hideAll(); s.classList.remove('hidden'); };
  function hideAll() {
    for (const s of [scrMain, scrMaps, scrSettings, scrPause, scrLevelup, scrEnd])
      if (s) s.classList.add('hidden');
  }

  function build() {
    // ---------- main ----------
    scrMain = el('div', 'screen solid hidden');
    el('div', 'title', scrMain, 'VampFrost');
    el('div', 'sub', scrMain, 'a frozen-blood survivors run');
    btn(scrMain, 'PLAY', () => { Events.emit('uiOpen'); refreshMaps(); show(scrMaps); });
    btn(scrMain, 'SETTINGS', () => { settingsFromPause = false; Events.emit('uiOpen'); syncSliders(); show(scrSettings); });
    goldTxt = el('div', 'gold', scrMain, '');
    el('div', 'small', scrMain, 'WASD move · SPACE dash · Q invisibility · ESC pause');

    // ---------- map select ----------
    scrMaps = el('div', 'screen solid hidden');
    el('h2', null, scrMaps, 'CHOOSE YOUR HUNT');
    mapGrid = el('div', 'mapgrid', scrMaps);
    btn(scrMaps, 'BACK', () => { Events.emit('uiClose'); showMain(); }).style.minWidth = '200px';

    // ---------- settings ----------
    scrSettings = el('div', 'screen dim hidden');
    const sp = el('div', 'panel', scrSettings);
    el('h2', null, sp, 'SETTINGS');
    const sliders = {};
    for (const [key, label] of [['master', 'Master'], ['music', 'Music'], ['sfx', 'SFX'], ['ui', 'UI']]) {
      const row = el('div', 'row', sp);
      el('label', null, row, label);
      const sl = el('input', null, row);
      sl.type = 'range'; sl.min = 0; sl.max = 1; sl.step = .01;
      sl.value = SAVE.data[key];
      sl.addEventListener('input', () => { SAVE.data[key] = +sl.value; SND.applyVolumes(); });
      sl.addEventListener('mouseenter', () => Events.emit('uiHover'));
      sliders[key] = sl;
    }
    UI._sliders = sliders;
    btn(sp, 'BACK', () => {
      SAVE.save(); Events.emit('uiClose');
      if (settingsFromPause) show(scrPause); else showMain();
    });

    // ---------- pause ----------
    scrPause = el('div', 'screen dim hidden');
    const pp = el('div', 'panel', scrPause);
    el('h2', null, pp, 'GAME PAUSED');
    btn(pp, 'RESUME', () => Game.setPause(false));
    btn(pp, 'SETTINGS', () => { settingsFromPause = true; Events.emit('uiOpen'); syncSliders(); show(scrSettings); });
    btn(pp, 'QUIT TO MENU', () => Game.endToMenu());

    // ---------- level up ----------
    scrLevelup = el('div', 'screen dim hidden');
    el('h2', null, scrLevelup, 'LEVEL UP!');
    const cardsBox = el('div', 'cards', scrLevelup);
    for (let i = 0; i < 3; i++) {
      const c = el('div', 'card', cardsBox);
      const t = el('div', 'ctitle', c);
      const d = el('div', 'cdesc', c);
      c.addEventListener('mouseenter', () => Events.emit('uiHover'));
      const idx = i;
      c.addEventListener('click', () => pick(idx));
      luCards.push({ c, t, d });
    }

    // ---------- end ----------
    scrEnd = el('div', 'screen dim hidden');
    const ep = el('div', 'panel', scrEnd);
    endTitle = el('h2', null, ep, 'VICTORY');
    endStats = el('div', null, ep, '');
    endStats.style.cssText = 'text-align:center;font-size:19px;line-height:1.7;margin:8px 0';
    btn(ep, 'CONTINUE', () => Game.endToMenu());
  }

  function syncSliders() {
    for (const k in UI._sliders) UI._sliders[k].value = SAVE.data[k];
  }

  function refreshMaps() {
    mapGrid.innerHTML = '';
    for (const m of MAPS) {
      const card = el('div', 'mapcard', mapGrid);
      card.style.background = `linear-gradient(180deg, ${css(mix(m.groundA, BLACK, .25))}, ${css(mix(m.bg, BLACK, .2))})`;
      el('div', 'mname', card, m.name);
      el('div', 'mboss', card, 'vs ' + BOSSES[m.bossId].name);
      const best = SAVE.data.bestWave[m.id];
      el('div', 'mbest', card, best > 0 ? `best: wave ${best}` : 'unexplored');
      card.addEventListener('mouseenter', () => Events.emit('uiHover'));
      card.addEventListener('click', () => { Events.emit('uiConfirm'); Game.startRun(m.id); });
    }
  }

  function showMain() {
    goldTxt.textContent = 'Blood Gold: ' + SAVE.data.gold;
    show(scrMain);
  }

  function showPause(on) {
    if (on) show(scrPause);
    else { scrPause.classList.add('hidden'); scrSettings.classList.add('hidden'); }
  }

  function closeSettingsIfOpen() {
    if (!scrSettings.classList.contains('hidden') && settingsFromPause) {
      SAVE.save(); show(scrPause);
      return true;
    }
    return false;
  }

  function showLevelUp() {
    Events.emit('uiOpen');
    luChoices = Upgrades.roll(3);
    for (let i = 0; i < 3; i++) {
      const has = i < luChoices.length;
      luCards[i].c.style.display = has ? '' : 'none';
      if (has) { luCards[i].t.textContent = luChoices[i].title; luCards[i].d.textContent = luChoices[i].desc; }
    }
    show(scrLevelup);
  }
  function pick(i) {
    if (Game.state !== 'levelup') return;
    if (i < luChoices.length) luChoices[i].apply();
    Events.emit('uiConfirm');
    Game.pendingLevelUps--;
    if (Game.pendingLevelUps > 0) { showLevelUp(); return; }
    hideAll();
    Game.state = 'playing';
  }

  function showEnd(victory) {
    endTitle.textContent = victory ? 'VICTORY' : 'YOU DIED';
    endTitle.style.color = victory ? '#8fd8ff' : '#e0405a';
    const m = Game.runTime / 60 | 0, s = Game.runTime % 60 | 0;
    endStats.innerHTML =
      `Map: ${Game.map.name}<br>` +
      `Survived: ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')} &nbsp;·&nbsp; Wave ${Game.wave}<br>` +
      `<span class="gold">Gold earned: ${Game.goldRun}</span>`;
    show(scrEnd);
  }

  function toast(str) {
    Game.hud.toastStr = str;
    Game.hud.toastT = 2.4;
    Events.emit('uiNotify');
  }

  return { build, showMain, showPause, showLevelUp, showEnd, hideAll, toast, closeSettingsIfOpen };
})();
// ================================================================
//  BOOT + MAIN LOOP
// ================================================================
function resize() {
  const dpr = Math.min(1.5, devicePixelRatio || 1);
  canvas.width = Math.max(320, innerWidth * dpr | 0);
  canvas.height = Math.max(240, innerHeight * dpr | 0);
}
addEventListener('resize', resize);
resize();

UI.build();
UI.showMain();

// audio needs one user gesture to unlock — generate everything on the first one
addEventListener('pointerdown', () => { SND.init(); SND.applyVolumes(); }, { once: true });

// auto-pause when the tab loses focus
addEventListener('blur', () => { if (Game.state === 'playing' && !Game.ending) Game.setPause(true); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  Game.update(dt);
  render();
  Input.clear();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
